<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC LIBRARY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #111113;
            --surface: #1b1b1f;
            --surface-2: #24242a;
            --line: #2e2e36;
            --text: #ececf0;
            --text-dim: #9a9aa6;
            --accent: #d8b36a;
            --accent-hover: #e8c784;
            --heart: #e07a7a;
            --font: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: var(--font); color: var(--text);
            background: radial-gradient(ellipse at 50% -10%, #1f1d24 0%, var(--bg) 60%) fixed;
        }

        /* 管理者だけに見せる要素 */
        body:not(.is-admin) .admin-only { display: none !important; }

        /* ===== ヘッダー ===== */
        header {
            max-width: 1080px; margin: 0 auto; padding: 44px 24px 24px;
            display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px;
            border-bottom: 1px solid var(--line);
        }
        h1 { font-size: clamp(26px, 4.5vw, 38px); font-weight: 700; letter-spacing: 0.18em; margin: 0; }
        .meta { margin: 8px 0 0; color: var(--text-dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #5fbf7f; }
        .sync-dot.busy { background: var(--accent); animation: pulse 1s infinite; }
        .sync-dot.error { background: var(--heart); }
        @keyframes pulse { 50% { opacity: 0.3; } }

        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn {
            font-family: var(--font); font-size: 14px; font-weight: 500;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 8px;
            transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
        }
        .btn-primary { background: var(--accent); color: #1a1408; border: 1px solid var(--accent); }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: wait; }
        .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .btn:focus-visible, .icon-btn:focus-visible, .like-btn:focus-visible, .img-container:focus-visible, .link-btn:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 3px;
        }

        /* 再読み込みボタン（一番目立たせる） */
        .btn-reload { font-weight: 700; padding: 10px 22px; box-shadow: 0 0 0 0 rgba(216, 179, 106, 0.5); }
        .btn-reload .icon { display: inline-block; font-size: 16px; line-height: 1; }
        .btn-reload.spinning .icon { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== ライブラリ ===== */
        main { max-width: 1080px; margin: 0 auto; padding: 32px 24px 40px; }
        .dashboard { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }

        .card {
            background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
            padding: 12px 14px 10px; display: flex; flex-direction: column;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: #3c3c46; }
        .card.sortable-ghost { opacity: 0.3; }
        body:not(.is-admin) .card { padding-top: 14px; }

        .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .drag-handle { cursor: grab; color: var(--text-dim); font-size: 18px; line-height: 1; padding: 4px; user-select: none; }
        .drag-handle:active { cursor: grabbing; }
        .icon-btn {
            background: none; border: 1px solid transparent; color: var(--text-dim);
            font-family: var(--font); font-size: 12px; cursor: pointer; padding: 4px 10px; border-radius: 4px;
        }
        .icon-btn:hover { color: var(--accent); border-color: var(--line); }

        .img-container { width: 100%; border-radius: 6px; margin-bottom: 12px; cursor: pointer; }
        .card img {
            width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
            border-radius: 6px; background: var(--surface-2);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .img-container:hover img { transform: translateY(-4px); box-shadow: 0 16px 30px rgba(0, 0, 0, 0.7); }

        /* 画像に重ねる再生マーク */
        .img-container { position: relative; }
        .img-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            border-radius: 6px; background: rgba(0, 0, 0, 0.35);
            opacity: 0; transition: opacity 0.25s, transform 0.3s ease; pointer-events: none;
        }
        .img-overlay span {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(216, 179, 106, 0.95); color: #1a1408;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; padding-left: 4px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
        }
        .img-container:hover .img-overlay { opacity: 1; transform: translateY(-4px); }

        /* PLAYボタン */
        .play-btn {
            width: 100%; margin-bottom: 12px; padding: 10px 0;
            background: transparent; color: var(--accent);
            border: 1px solid var(--accent); border-radius: 6px;
            font-family: var(--font); font-size: 14px; font-weight: 700; letter-spacing: 0.2em;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: background 0.2s, color 0.2s;
        }
        .play-btn:hover { background: var(--accent); color: #1a1408; }
        .play-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

        .title { font-weight: 700; font-size: 1.05em; margin-bottom: 4px; }
        .description { font-size: 0.85em; color: var(--text-dim); line-height: 1.6; margin-bottom: 12px; flex-grow: 1; white-space: pre-wrap; }

        .stats { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 8px; }
        .play-count { font-size: 13px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
        .like-btn {
            background: none; border: none; cursor: pointer; color: var(--heart);
            font-family: var(--font); font-size: 14px; display: flex; align-items: center; gap: 6px;
            padding: 5px 10px; border-radius: 20px; transition: background 0.2s, transform 0.2s;
            font-variant-numeric: tabular-nums;
        }
        .like-btn:hover { background: rgba(224, 122, 122, 0.12); }

        #status { text-align: center; color: var(--text-dim); margin-top: 40px; white-space: pre-line; line-height: 1.8; }

        /* ===== フッター（管理者ログイン） ===== */
        footer { max-width: 1080px; margin: 0 auto; padding: 0 24px 40px; text-align: right; }
        .link-btn {
            background: none; border: none; color: #55555f; font-family: var(--font);
            font-size: 12px; cursor: pointer; padding: 4px 6px;
        }
        .link-btn:hover { color: var(--text-dim); }

        /* ===== モーダル ===== */
        dialog {
            width: min(520px, calc(100% - 32px)); padding: 0;
            border: 1px solid var(--line); border-radius: 12px;
            background: var(--surface); color: var(--text);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }
        dialog.small { width: min(380px, calc(100% - 32px)); }
        dialog::backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px); }
        .dialog-inner { padding: 26px 26px 22px; }
        dialog h2 { font-size: 20px; margin: 0 0 18px; }
        dialog label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
        dialog input, dialog textarea {
            width: 100%; margin-bottom: 14px; padding: 10px 12px;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--line); border-radius: 6px;
            font-family: var(--font); font-size: 15px;
        }
        dialog input:focus, dialog textarea:focus { outline: none; border-color: var(--accent); }
        dialog textarea { resize: vertical; min-height: 80px; }
        .preview { display: flex; gap: 12px; align-items: center; margin: -4px 0 14px; }
        .preview img { width: 52px; height: 52px; object-fit: cover; border-radius: 4px; background: var(--bg); }
        .preview span { font-size: 12px; color: var(--text-dim); }
        .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
        .form-error { color: var(--heart); font-size: 13px; margin: -6px 0 12px; min-height: 1em; }

        /* ===== プレイヤー（曲ページをフレーム表示） ===== */
        body.player-open { overflow: hidden; }
        .player {
            position: fixed; inset: 0; z-index: 50;
            display: none; flex-direction: column;
            background: var(--bg);
        }
        .player.open { display: flex; }
        .player-bar {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
            background: var(--surface); border-bottom: 1px solid var(--line);
        }
        .back-btn { flex-shrink: 0; }
        .player-title {
            font-weight: 700; font-size: 15px; letter-spacing: 0.04em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
        }
        .player-hint {
            display: flex; align-items: center; justify-content: center; gap: 12px;
            padding: 12px 16px;
            background: var(--accent); color: #1a1408;
            font-size: 15px; font-weight: 700; text-align: center;
        }
        .player-hint[hidden] { display: none; }
        .player-hint .arrow { display: inline-block; animation: bounce 1.2s ease-in-out infinite; }
        @keyframes bounce { 50% { transform: translateY(4px); } }
        .hint-close {
            background: none; border: 1px solid rgba(26, 20, 8, 0.35); color: #1a1408;
            border-radius: 4px; padding: 2px 10px; font-family: var(--font); font-size: 13px; cursor: pointer;
        }
        .player iframe { flex: 1; width: 100%; border: 0; background: #fff; }

        #toast {
            position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); z-index: 60;
            background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
            padding: 12px 20px; border-radius: 8px; font-size: 14px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
        @media (max-width: 520px) {
            .toolbar { width: 100%; }
            .toolbar .btn { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h1>MUSIC LIBRARY</h1>
            <p class="meta"><span class="sync-dot" id="syncDot"></span><span id="syncText">読み込み中...</span></p>
        </div>
        <div class="toolbar">
            <button class="btn btn-primary btn-reload" id="reloadBtn" type="button"><span class="icon">↻</span>再読み込み</button>
            <a class="btn btn-ghost admin-only" id="sheetLink" target="_blank" rel="noopener">スプレッドシートで編集</a>
            <button class="btn btn-ghost admin-only" id="addBtn" type="button">＋ 曲を追加</button>
        </div>
    </header>

    <main>
        <div id="status">楽曲を読み込み中...</div>
        <div class="dashboard" id="dashboard"></div>
    </main>

    <footer>
        <button class="link-btn" id="adminToggle" type="button">管理者ログイン</button>
    </footer>

    <!-- プレイヤー：曲ページをフレーム内に表示 -->
    <div class="player" id="player" aria-hidden="true">
        <div class="player-bar">
            <button class="btn btn-primary back-btn" id="backBtn" type="button">← 一覧に戻る</button>
            <div class="player-title" id="playerTitle"></div>
        </div>
        <div class="player-hint" id="playerHint">
            <span><span class="arrow">↓</span>&nbsp;ページ内の <b>▶ 再生ボタン</b> を押すと演奏が始まります</span>
            <button class="hint-close" id="hintClose" type="button">閉じる</button>
        </div>
        <iframe id="playerFrame" title="楽曲ページ" allow="autoplay; fullscreen"></iframe>
    </div>

    <!-- 追加・編集モーダル（管理者のみ） -->
    <dialog id="songDialog">
        <form id="songForm" class="dialog-inner">
            <h2 id="dialogTitle">曲を追加</h2>

            <label for="f-title">タイトル</label>
            <input type="text" id="f-title" placeholder="半分のスピードで" required>

            <label for="f-html">HTMLファイル名</label>
            <input type="text" id="f-html" placeholder="hanbuno.html" required>

            <label for="f-image">画像ファイル名</label>
            <input type="text" id="f-image" placeholder="hanbuno.jpg" required>
            <div class="preview"><img id="f-preview" alt=""><span>画像のプレビュー</span></div>

            <label for="f-desc">説明</label>
            <textarea id="f-desc" rows="3" required></textarea>

            <div class="dialog-actions">
                <button type="button" class="btn btn-ghost" id="cancelBtn">キャンセル</button>
                <button type="submit" class="btn btn-primary" id="saveBtn">保存</button>
            </div>
        </form>
    </dialog>

    <!-- 管理者ログイン -->
    <dialog id="loginDialog" class="small">
        <form id="loginForm" class="dialog-inner">
            <h2>管理者ログイン</h2>
            <label for="f-key">管理者キー</label>
            <input type="password" id="f-key" autocomplete="current-password" required>
            <p class="form-error" id="loginError"></p>
            <div class="dialog-actions">
                <button type="button" class="btn btn-ghost" id="loginCancel">キャンセル</button>
                <button type="submit" class="btn btn-primary" id="loginBtn">ログイン</button>
            </div>
        </form>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        // ===== 設定 =====
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbxEVvx5vfY_ZY6SWkPj6znhH2MnRwGbB5K_tNWrlz3Uq5NSuAuTOGm9VOBAiYSmR2EBiw/exec';
        // ★ 楽曲データのスプレッドシートのURLに置き換えてください
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/XXXXXXXXXXXXXXXX/edit';
        // スプレッドシートの直接編集を拾うための自動同期間隔（ミリ秒）
        const POLL_INTERVAL = 30000;
        const KEY_STORAGE = 'musicLibraryAdminKey';

        const dashboard = document.getElementById('dashboard');
        const statusEl = document.getElementById('status');
        const syncDot = document.getElementById('syncDot');
        const syncText = document.getElementById('syncText');
        const reloadBtn = document.getElementById('reloadBtn');
        const dialog = document.getElementById('songDialog');
        const loginDialog = document.getElementById('loginDialog');
        const form = document.getElementById('songForm');
        const fields = {
            title: document.getElementById('f-title'),
            html: document.getElementById('f-html'),
            image: document.getElementById('f-image'),
            description: document.getElementById('f-desc')
        };
        const preview = document.getElementById('f-preview');

        let songs = [];
        let editingId = null;
        let isDragging = false;
        let adminKey = null;

        document.getElementById('sheetLink').href = SHEET_URL;

        // ===== 共通 =====
        function postToGas(payload) {
            return fetch(GAS_URL, {
                method: 'POST',
                mode: 'no-cors',
                keepalive: true,
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });
        }

        let toastTimer;
        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
        }

        function setSync(state, text) {
            syncDot.className = 'sync-dot' + (state ? ' ' + state : '');
            syncText.textContent = text;
        }

        let syncTimer;
        function syncSoon(delay = 300) {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(() => loadSongs(), delay);
        }

        // ===== 管理者 =====
        function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
        function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
        function safeRemove(k) { try { localStorage.removeItem(k); } catch {} }

        async function verifyKey(key) {
            const res = await fetch(`${GAS_URL}?action=verify&key=${encodeURIComponent(key)}&t=${Date.now()}`, { cache: 'no-store' });
            const data = await res.json();
            return data && data.ok === true;
        }

        function setAdmin(key) {
            adminKey = key;
            const on = !!key;
            document.body.classList.toggle('is-admin', on);
            document.getElementById('adminToggle').textContent = on ? 'ログアウト' : '管理者ログイン';
            if (sortable) sortable.option('disabled', !on);
        }

        document.getElementById('adminToggle').addEventListener('click', () => {
            if (adminKey) {
                safeRemove(KEY_STORAGE);
                setAdmin(null);
                toast('ログアウトしました');
            } else {
                document.getElementById('f-key').value = '';
                document.getElementById('loginError').textContent = '';
                loginDialog.showModal();
            }
        });
        document.getElementById('loginCancel').addEventListener('click', () => loginDialog.close());
        loginDialog.addEventListener('click', e => { if (e.target === loginDialog) loginDialog.close(); });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const key = document.getElementById('f-key').value;
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            btn.disabled = true;
            errEl.textContent = '';
            try {
                if (await verifyKey(key)) {
                    safeSet(KEY_STORAGE, key);
                    setAdmin(key);
                    loginDialog.close();
                    toast('管理者としてログインしました');
                } else {
                    errEl.textContent = 'キーが正しくありません';
                }
            } catch (err) {
                console.error(err);
                errEl.textContent = '確認できませんでした。通信状況を確認してください';
            } finally {
                btn.disabled = false;
            }
        });

        // ===== カード =====
        function el(tag, className, text) {
            const e = document.createElement(tag);
            if (className) e.className = className;
            if (text !== undefined) e.textContent = text;
            return e;
        }

        function createCard(song) {
            const card = el('article', 'card');
            card.dataset.id = song.id;

            // 並び替え・編集は管理者のみ
            const top = el('div', 'card-top admin-only');
            const handle = el('span', 'drag-handle', '⠿');
            handle.title = 'ドラッグして並び替え';
            const editBtn = el('button', 'icon-btn', '編集');
            editBtn.type = 'button';
            editBtn.addEventListener('click', () => openDialog(song.id));
            top.append(handle, editBtn);

            const imgBox = el('div', 'img-container');
            imgBox.tabIndex = 0;
            imgBox.title = 'クリックして再生';
            imgBox.addEventListener('click', () => playSong(song.id));
            imgBox.addEventListener('keydown', e => { if (e.key === 'Enter') playSong(song.id); });
            const img = el('img');
            img.src = song.image;
            img.alt = song.title;
            img.loading = 'lazy';
            const overlay = el('div', 'img-overlay');
            overlay.appendChild(el('span', null, '▶'));
            imgBox.append(img, overlay);

            const playBtn = el('button', 'play-btn', '▶ PLAY');
            playBtn.type = 'button';
            playBtn.addEventListener('click', () => playSong(song.id));

            const stats = el('div', 'stats');
            const play = el('div', 'play-count', '▶ ');
            const playSpan = el('span', null, song.playCount ?? 0);
            playSpan.id = `play-${song.id}`;
            play.appendChild(playSpan);

            const likeBtn = el('button', 'like-btn', '♥ ');
            likeBtn.type = 'button';
            const likeSpan = el('span', null, song.likes ?? 0);
            likeSpan.id = `like-${song.id}`;
            likeBtn.appendChild(likeSpan);
            likeBtn.addEventListener('click', () => likeSong(song.id));
            stats.append(play, likeBtn);

            card.append(top, imgBox, el('div', 'title', song.title), el('div', 'description', song.description), playBtn, stats);
            return card;
        }

        function render() {
            dashboard.replaceChildren(...songs.map(createCard));
            if (songs.length) {
                statusEl.style.display = 'none';
            } else {
                statusEl.style.display = 'block';
                statusEl.textContent = 'まだ曲がありません。';
            }
        }

        // ===== スプレッドシートから読み込み =====
        let currentLoad = null;

        // manual = true のとき（再読み込みボタン）だけ矢印を回す
        async function loadSongs({ manual = false } = {}) {
            if (isDragging || dialog.open || loginDialog.open) return;
            if (manual) { reloadBtn.classList.add('spinning'); reloadBtn.disabled = true; }
            try {
                // 自動同期の途中で押された場合は、その完了を待つ
                if (!currentLoad) currentLoad = fetchSongs().finally(() => { currentLoad = null; });
                await currentLoad;
            } finally {
                if (manual) { reloadBtn.classList.remove('spinning'); reloadBtn.disabled = false; }
            }
        }

        async function fetchSongs() {
            setSync('busy', '同期中...');
            // 応答がない場合も20秒で打ち切る（回りっぱなし・同期中のままを防ぐ）
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 20000);
            try {
                const res = await fetch(`${GAS_URL}?t=${Date.now()}`, { cache: 'no-store', signal: controller.signal });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); }
                catch { console.error('GASの応答:', text); throw new Error('JSONではない応答'); }
                if (!Array.isArray(data)) throw new Error('配列ではない応答');

                if (JSON.stringify(data) !== JSON.stringify(songs) || !dashboard.children.length) {
                    songs = data;
                    render();
                }
                const now = new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                setSync('', `${songs.length} 曲・${now} に同期`);
            } catch (err) {
                console.error(err);
                setSync('error', '同期できませんでした');
                if (!songs.length) {
                    statusEl.style.display = 'block';
                    statusEl.textContent = 'データを読み込めませんでした。\n少し時間をおいて再読み込みしてください。';
                }
            } finally {
                clearTimeout(timer);
            }
        }

        // ===== 並び替え（管理者のみ） =====
        const sortable = new Sortable(dashboard, {
            handle: '.drag-handle',
            animation: 150,
            disabled: true,
            onStart() { isDragging = true; },
            async onEnd() {
                isDragging = false;
                const orderedIds = Array.from(dashboard.children).map(c => c.dataset.id);
                setSync('busy', '並び順を保存中...');
                try { await postToGas({ action: 'reorder', key: adminKey, orderedIds }); }
                catch (e) { console.error(e); toast('並び順を保存できませんでした'); }
                syncSoon();
            }
        });

        // ===== 再生・いいね（誰でも可） =====
        const player = document.getElementById('player');
        const playerFrame = document.getElementById('playerFrame');
        const playerHint = document.getElementById('playerHint');

        function playSong(id) {
            const song = songs.find(s => String(s.id) === String(id));
            if (!song) return;
            const span = document.getElementById(`play-${id}`);
            span.textContent = Number(span.textContent) + 1;
            postToGas({ action: 'play', id }).catch(console.error);

            openPlayer(song);
            // ブラウザの「戻る」でも一覧に戻れるように履歴を1つ積む
            history.pushState({ player: song.id }, '', `#play-${song.id}`);
        }

        function openPlayer(song) {
            document.getElementById('playerTitle').textContent = song.title;
            playerHint.hidden = false;
            playerFrame.src = song.html;
            player.classList.add('open');
            player.setAttribute('aria-hidden', 'false');
            document.body.classList.add('player-open');
            document.getElementById('backBtn').focus();
        }

        function closePlayer() {
            if (!player.classList.contains('open')) return;
            player.classList.remove('open');
            player.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('player-open');
            playerFrame.src = 'about:blank';   // 音を止める
            syncSoon(0);                        // 戻ったら最新状態に
        }

        // 「一覧に戻る」ボタン：履歴を戻す（popstate で閉じる）
        document.getElementById('backBtn').addEventListener('click', () => {
            if (history.state && history.state.player) history.back();
            else { closePlayer(); history.replaceState(null, '', location.pathname + location.search); }
        });
        // ブラウザの戻るボタン・スマホの戻るジェスチャー
        window.addEventListener('popstate', () => closePlayer());
        // Escキーでも戻る
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && player.classList.contains('open')) document.getElementById('backBtn').click();
        });

        document.getElementById('hintClose').addEventListener('click', () => { playerHint.hidden = true; });

        // 曲ページ読み込み後：再生が始まったら案内を自動で消す
        playerFrame.addEventListener('load', () => {
            if (!player.classList.contains('open')) return;
            try {
                const doc = playerFrame.contentDocument;
                if (!doc) return;
                // 曲ページ内の「戻る」リンク等で一覧ページ自体が開かれたら、プレイヤーを閉じる
                const inner = playerFrame.contentWindow.location;
                const norm = path => path.replace(/index\.html?$/, '');
                if (inner.href !== 'about:blank' && norm(inner.pathname) === norm(location.pathname)) {
                    document.getElementById('backBtn').click();
                    return;
                }
                // audio / video の再生開始を検知（play イベントはバブルしないのでキャプチャで拾う）
                doc.addEventListener('play', () => { playerHint.hidden = true; }, true);
            } catch (e) {
                // 別ドメインのページの場合は検知できないので、案内は「閉じる」まで表示したまま
            }
        });

        async function likeSong(id) {
            const span = document.getElementById(`like-${id}`);
            span.textContent = Number(span.textContent) + 1;
            const btn = span.parentElement;
            btn.style.transform = 'scale(1.2)';
            setTimeout(() => btn.style.transform = 'scale(1)', 200);
            try { await postToGas({ action: 'like', id }); }
            catch (e) { console.error(e); }
            syncSoon(600);
        }

        // ===== 追加・編集モーダル（管理者のみ） =====
        function openDialog(id = null) {
            if (!adminKey) return;
            editingId = id;
            const song = id !== null ? songs.find(s => String(s.id) === String(id)) : null;
            document.getElementById('dialogTitle').textContent = song ? '曲を編集' : '曲を追加';
            for (const key in fields) fields[key].value = song ? (song[key] ?? '') : '';
            updatePreview();
            dialog.showModal();
            fields.title.focus();
        }

        function updatePreview() {
            const src = fields.image.value.trim();
            if (src) { preview.src = src; preview.style.visibility = 'visible'; }
            else { preview.removeAttribute('src'); preview.style.visibility = 'hidden'; }
        }
        fields.image.addEventListener('input', updatePreview);
        preview.addEventListener('error', () => { preview.style.visibility = 'hidden'; });

        document.getElementById('addBtn').addEventListener('click', () => openDialog());
        document.getElementById('cancelBtn').addEventListener('click', () => dialog.close());
        reloadBtn.addEventListener('click', () => loadSongs({ manual: true }));
        dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });
        dialog.addEventListener('close', () => syncSoon(0));

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            const values = {};
            for (const key in fields) values[key] = fields[key].value.trim();

            saveBtn.disabled = true;
            saveBtn.textContent = '保存中...';
            try {
                if (editingId !== null) {
                    await postToGas({ action: 'update', key: adminKey, id: editingId, ...values });
                    toast('変更を保存しました');
                } else {
                    await postToGas({ action: 'add', key: adminKey, ...values });
                    toast('曲を追加しました');
                }
                dialog.close();
            } catch (err) {
                console.error(err);
                toast('保存できませんでした。通信状況を確認してください');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '保存';
            }
        });

        // ===== 自動同期 =====
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') loadSongs();
        });
        setInterval(() => {
            if (document.visibilityState === 'visible' && !document.body.classList.contains('player-open')) loadSongs();
        }, POLL_INTERVAL);

        // ===== 起動 =====
        (async () => {
            // プレイヤー表示中にリロードされた場合は一覧から始める
            if (location.hash.startsWith('#play-')) history.replaceState(null, '', location.pathname + location.search);
            loadSongs();
            // 保存済みのキーがあれば、まだ有効か確認してから管理者モードにする
            const saved = safeGet(KEY_STORAGE);
            if (saved) {
                try {
                    if (await verifyKey(saved)) setAdmin(saved);
                    else safeRemove(KEY_STORAGE);
                } catch (e) { console.error(e); }
            }
        })();
    </script>
</body>
</html>
